<div id="game-touch-controls" aria-label="触屏操作">
  <div class="game-dpad" aria-label="方向键">
    <button class="game-control game-up" data-game-key="ArrowUp" aria-label="向上">▲</button>
    <button class="game-control game-left" data-game-key="ArrowLeft" aria-label="向左">◀</button>
    <button class="game-control game-right" data-game-key="ArrowRight" aria-label="向右">▶</button>
    <button class="game-control game-down" data-game-key="ArrowDown" aria-label="向下">▼</button>
  </div>
  <div class="game-actions" aria-label="动作键">
    <button class="game-control game-action game-action-e" data-game-key="KeyE" aria-label="属性面板">E</button>
    <button class="game-control game-action game-action-f" data-game-key="KeyF" aria-label="射击或确认">F</button>
  </div>
  <button class="game-control game-escape" data-game-key="Escape" aria-label="暂停或返回">ESC</button>
</div>
<div id="game-rotate-overlay" role="status" aria-live="polite">
  <div class="game-rotate-card">
    <span class="game-rotate-icon" aria-hidden="true">↻</span>
    <span>请横屏游玩</span>
  </div>
</div>
