[project]
name = "game"
version = "0.1.0"
description = "像素风肉鸽射击游戏"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.7",
]

[project.scripts]
game = "game:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "game/assets"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/src/game",
    "/assets",
    "/docs",
    "/tests",
    "/tools",
    "/target.md",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
